[package]
name = "cache-doctor"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A read-only offline Cargo cache evidence scanner"
license = "MIT"
repository = "https://github.com/yoshiii-xyz/cache-doctor"
keywords = ["cargo", "cache", "offline", "checksum", "diagnostics"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
